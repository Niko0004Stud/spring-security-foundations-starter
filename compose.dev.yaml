name: notes-bff-jwt

services:

  frontend:
    image: nginx:1.30-alpine
    restart: unless-stopped
    volumes:
      - ./frontend/src:/usr/share/nginx/html:ro
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    environment:
      API_UPSTREAM: host.docker.internal:8080
      FRONTEND_UPSTREAM: frontend:80
      SITE_ADDRESS: ":80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_healthy
